[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "actioncage"
version = "0.1.0"
description = "A deterministic policy firewall for agent tool calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SamAlpha1" }]
keywords = ["agents", "security", "policy", "tool-calls", "guardrails"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
actioncage = "actioncage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/actioncage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
